services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Do not bind a host port — Dokploy/Traefik routes to this internally.
    # Binding 8000:8000 fails when another service already owns that port.
    expose:
      - "8000"
    environment:
      # API
      ENVIRONMENT: ${ENVIRONMENT:-production}
      API_PORT: ${API_PORT:-8000}
      PROJECT_NAME: ${PROJECT_NAME:-Going Twice API}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      GLOBAL_RATE_LIMIT: ${GLOBAL_RATE_LIMIT:-120/minute}

      # External Postgres (separate Dokploy service — not started here)
      POSTGRES_SERVER: ${POSTGRES_SERVER}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}

      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # Auth
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-6}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      AUTH_ALLOW_MAGIC_OTP_BYPASS: ${AUTH_ALLOW_MAGIC_OTP_BYPASS:-false}
      AUTH_EXPOSE_VERIFICATION_CODE: ${AUTH_EXPOSE_VERIFICATION_CODE:-false}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-60}

      # Email
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      MAIL_FROM: ${MAIL_FROM:-no-reply@goingtwice.eg}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Going Twice}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_TIMEOUT_SECONDS: ${MAIL_TIMEOUT_SECONDS:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      CONTACT_INBOX: ${CONTACT_INBOX:-}

      # Email verification
      EMAIL_VERIFICATION_CODE_LENGTH: ${EMAIL_VERIFICATION_CODE_LENGTH:-6}
      EMAIL_VERIFICATION_EXPIRE_MINUTES: ${EMAIL_VERIFICATION_EXPIRE_MINUTES:-10}
      EMAIL_VERIFICATION_MAX_ATTEMPTS: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:-5}
      EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}

      # Listing photos (disk). Mount a volume so they survive redeploys.
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      MAX_UPLOAD_FILES: ${MAX_UPLOAD_FILES:-7}

      # Main-photo white-background helper (Gemini). Empty disables it.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  uploads_data:
